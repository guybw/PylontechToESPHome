# =============================================================================
#  pylontech_example_esp32.yaml — ESPHome serial bridge, ESP32 version
# =============================================================================
#  For an ESP32.  The pins below match the RS232/RS485 hat for a plug-in
#  "D1 Mini ESP32" (github.com/guybw/ESP_to_RS232_Hat, hat/), which is what the
#  ready-made units use.  Using an ESP8266?  Use pylontech_example_esp8266.yaml.
#
#  It does NO protocol parsing — it just exposes the battery's RS232 console
#  over the ESPHome Native API using the `serial_proxy` component.  The Home
#  Assistant "Pylontech (ESPHome serial bridge)" integration does the talking.
#
#  Pins
#    The battery link is on GPIO18 (TX) / GPIO26 (RX), NOT GPIO1/GPIO3.  On an
#    ESP32, GPIO1/GPIO3 are UART0, wired to the board's USB chip — with those
#    pins the commands go out of the USB port and no reply ever comes back.
#    Wiring your own ESP32?  The ESP32 can put a hardware UART on almost any
#    GPIO, so use whatever you wired (avoid GPIO1/3, 6-11 and the input-only
#    34-39 for TX).
#
#  Requirements
#    - ESPHome >= 2026.3.0  (the `serial_proxy` component).
#    - A serial link to the battery's "Console" port (the hat / a RS232<->TTL
#      adapter such as a MAX3232 module).  Console runs at 115200 8N1.
#
#  Setup
#    1. Copy this file, e.g. to `pylontech.yaml` in your ESPHome config.
#    2. Create `secrets.yaml` alongside it with:
#
#         wifi_ssid: "YourWiFi"
#         wifi_password: "YourWiFiPassword"
#         pylontech_api_key: "<32-byte base64 key>"   # ESPHome makes one for you
#         pylontech_ota_password: "SomethingLong"
#
#    3. Set `manual_ip` below to a free static IP on your LAN.
#    4. Install / Flash (USB for the first flash, OTA after that).  USB works
#       with the hat fitted: the battery isn't on the USB UART.
#    5. Note the device's IP and the API encryption key — you'll enter both in
#       Home Assistant when you add the integration.
# =============================================================================

esphome:
  name: pylontech
  friendly_name: Pylontech

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf

# Logs go over UART0 = the board's USB, which is separate from the battery
# link, so logging can stay on (unlike the ESP8266 version).
logger:

# Native API — required by serial_proxy and by Home Assistant.
api:
  encryption:
    key: !secret pylontech_api_key

ota:
  - platform: esphome
    password: !secret pylontech_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # A fixed IP so Home Assistant always knows where to reach the bridge.
  manual_ip:
    static_ip: 192.168.1.50
    gateway: 192.168.1.1
    subnet: 255.255.255.0

# Hat status LED (yellow): blinks while WiFi/API aren't connected, off when OK.
# Delete this block if your board has nothing on GPIO22.
status_led:
  pin: GPIO22

# --- The bridge ------------------------------------------------------------
uart:
  - id: uart_bus
    tx_pin: GPIO18   # -> RS232 transceiver -> battery RX (RJ11 pin 2 / RJ45 pin 6)
    rx_pin: GPIO26   # <- RS232 transceiver <- battery TX (RJ11 pin 3 / RJ45 pin 3)
    baud_rate: 115200
    # 4096, not the 2048 default: the `pwr` reply is a ~2.6 KB burst and a
    # smaller buffer overruns it (early battery rows get dropped/merged).
    rx_buffer_size: 4096

  # Optional: the hat's RS485 screw terminal (A/B/GND).  Not used by the
  # Pylontech integration; it's a spare port any serial_proxy client can use
  # (e.g. a Modbus device).  9600 is only the start-up rate — the client can
  # change baud/parity/stop bits at runtime.  Delete this and the "RS485"
  # serial_proxy below if you don't need it.
  - id: rs485_bus
    tx_pin:                   # -> SP3485 DI
      number: GPIO5
      ignore_strapping_warning: true
    rx_pin: GPIO23            # <- SP3485 RO
    flow_control_pin: GPIO19  # -> SP3485 DE + /RE, high while sending
    baud_rate: 9600

serial_proxy:
  - id: pylontech_console
    uart_id: uart_bus
    name: "Pylontech Console"     # must match "Serial port name" in HA
    port_type: TTL
  - id: rs485_port
    uart_id: rs485_bus
    name: "RS485"
    port_type: RS485
