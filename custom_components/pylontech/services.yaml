get_log:
  fields:
    source:
      required: false
      default: event
      selector:
        select:
          options:
            - event
            - history
    count:
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 50
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: pylontech

set_time:
  fields:
    datetime:
      required: false
      selector:
        datetime:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: pylontech
